name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3'
      # The tag only TRIGGERS this; hex publishes whatever the .app.src says.
      # Without this check, tagging v1.0.1 against a 1.0.0 manifest silently
      # republishes 1.0.0, or fails as "already published" with a confusing message.
      - name: Tag must match the application version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          vsn="$(sed -n 's/.*{vsn, "\([^"]*\)".*/\1/p' src/internetdata.app.src)"
          if [ "$tag" != "$vsn" ] ; then
            echo "tag $tag does not match src/internetdata.app.src version $vsn" >&2
            exit 1
          fi
      - run: rebar3 eunit
      # --repo hexpm is REQUIRED, not decoration: without it rebar3_hex takes a
      # code path that never merges the environment into the repo config, so
      # HEX_API_KEY is ignored and this fails with "No write key found for user"
      # however correctly the secret is set. Hex publishes no OIDC path, so
      # every release needs the key.
      # A NEW package's first release is staged for its owner's approval rather
      # than published, and rebar3 exits 0 for it. Failing here skips the GitHub
      # Release, which would otherwise announce a version hex.pm does not serve;
      # once it is approved, cut that release by hand from CHANGELOG.md.
      - name: Publish to hex.pm
        run: |
          set -o pipefail
          rebar3 as publish hex publish --repo hexpm --yes 2>&1 | tee publish.log
          if grep -q 'staged for approval' publish.log ; then
            echo "::error::hex.pm staged this release for its owner's approval and serves nothing yet"
            exit 1
          fi
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > notes.md
          if ! grep -q '^### ' notes.md ; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
